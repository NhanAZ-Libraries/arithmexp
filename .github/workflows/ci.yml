name: Test and analyze arithmexp package

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: Validate package, test, and analyze parser
    runs-on: ubuntu-24.04
    steps:
    - name: Check out arithmexp source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Validate Composer manifest and lockfile
      run: composer validate --strict --no-check-publish

    - name: Install locked Composer dependencies
      run: composer install --prefer-dist --no-progress --no-scripts --no-plugins

    - name: Run upstream PHPUnit suite
      run: ./vendor/bin/phpunit tests --testdox

    - name: Analyze parser source with PHPStan at maximum level
      run: ./vendor/bin/phpstan analyse --level=max --no-progress src
