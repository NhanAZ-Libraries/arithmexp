name: Validate arithmexp package and run tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  phpunit:
    name: Validate Composer package and run PHPUnit
    runs-on: ubuntu-24.04
    steps:
    - name: Check out arithmexp source
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Validate Composer manifest and lockfile
      run: composer validate --strict --no-check-publish

    - name: Install locked Composer dependencies
      run: composer install --prefer-dist --no-progress --no-scripts --no-plugins

    - name: Run upstream PHPUnit suite
      run: ./vendor/bin/phpunit tests --testdox
